name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # Use the local toolchain versions; never install the VM runtime in CI.
      MISE_ENABLE_TOOLS: go,golangci-lint,hadolint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-v0-ci
      - name: Prepare test temporary directory
        run: mkdir -p /tmp/opencode
      - name: Lint
        run: mise run lint
      - name: Build launcher
        run: mise run cli
      - name: Check module consistency
        run: go mod tidy -diff
      - name: Compile all tests
        run: go test -run '^$' ./...
      - name: Run non-VM tests, including image smoke tests
        run: mise run test:non-vm
