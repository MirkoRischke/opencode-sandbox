["gateway:start"]
description = "Start the host LLM gateway"
dir = "{{config_root}}/llm-gateway"
run = "bash start.sh"

["gateway:stop"]
description = "Stop the host LLM gateway, preserving credentials and usage"
dir = "{{config_root}}/llm-gateway"
run = "bash compose.sh stop"

["gateway:authenticate"]
description = "Authenticate the gateway with a ChatGPT subscription"
dir = "{{config_root}}/llm-gateway"
run = """bash compose.sh exec litellm python -c 'from litellm.llms.chatgpt.authenticator import Authenticator; Authenticator().get_access_token()'"""

["gateway:authenticate:copilot"]
description = "Authenticate the gateway with a GitHub Copilot subscription"
dir = "{{config_root}}/llm-gateway"
run = """bash compose.sh exec litellm python -c 'from litellm.llms.github_copilot.authenticator import Authenticator; Authenticator().get_api_key()'"""
