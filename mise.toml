[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
hadolint = "2.15.1"
microsandbox = "0.7.11"

[task_config]
includes = ["llm-gateway/tasks.toml"]

[tasks.lint]
description = "Lint Go code and the Dockerfile"
run = ["golangci-lint run --build-tags live ./...", "hadolint Dockerfile"]

[tasks.verify]
description = "Run linting and the standard test suite"
depends = ["lint", "test"]

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt ./..."

[tasks.quality]
description = "Report local complexity; pass baseline or compare to measure a refactor"
usage = 'arg "[action]" default="report" { choices "report" "baseline" "compare" }'
run = 'python3 scripts/quality.py "${usage_action?}"'

[tasks.cli]
description = "Build the worktree launcher"
run = "go build -o bin/opencode-sandbox ./cmd/opencode-sandbox"

[tasks.install]
description = "Build and install the launcher to ~/.local/bin"
depends = ["cli"]
run = '''
mkdir -p "$HOME/.local/bin"
install -m755 bin/opencode-sandbox "$HOME/.local/bin/opencode-sandbox"
'''

[tasks.upgrade-microsandbox]
description = "Upgrade the Microsandbox SDK/runtime pair and dotfiles pin"
usage = '''
arg "[version]" default="latest"
flag "--dotfiles <path>" default="../dotfiles"
'''
run = 'go run ./scripts/upgrade-microsandbox --dotfiles "${usage_dotfiles?}" "${usage_version?}"'

[tasks.build]
description = "Build the sandbox base image"
sources = ["Dockerfile", ".dockerignore"]
outputs = { auto = true }
run = "docker build -t opencode-sandbox:base ."

[tasks.load]
description = "Build and import the image into Microsandbox"
depends = ["build"]
sources = ["Dockerfile", ".dockerignore"]
outputs = { auto = true }
run = "bash -o pipefail -c 'docker save opencode-sandbox:base | msb load'"

[tasks."test:prepare"]
description = "Prepare test images when their inputs change"
depends = ["load"]
sources = ["tests/fixtures/custom-image/Dockerfile"]
outputs = { auto = true }
run = [
  "docker build --pull=false -t opencode-sandbox:test-custom tests/fixtures/custom-image",
  "bash -o pipefail -c 'docker save opencode-sandbox:test-custom | msb load'",
]

[tasks."test:unit"]
description = "Run fast tests without VMs or external services"
run = "go test -count=1 -timeout 10s ./internal/... ./llm-gateway ./scripts/..."

[tasks."test:non-vm"]
description = "Run all tests without Microsandbox or host credentials; Docker required"
depends = ["build"]
run = [
  "mkdir -p /tmp/opencode",
  "go test -race -count=1 -v -timeout 2m ./internal/... ./llm-gateway ./scripts/... ./tests/cli ./tests/image",
]

[tasks."test:image"]
description = "Build and smoke-test the Docker image without VMs or credentials"
depends = ["build"]
run = "go test -count=1 -v -timeout 2m ./tests/image"

[tasks.test]
description = "Prepare changed images and run the test suite"
depends = ["test:prepare"]
run = "go test -count=1 -v -parallel 4 -timeout 10m ./..."

[tasks."test:live"]
description = "Send a real VM OpenCode prompt through the authenticated host gateway"
run = "go test -count=1 -v -tags live -run '^TestOpenCodePromptsThroughHostGateway$' -timeout 6m ./tests/vm"
