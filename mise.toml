[tools]
go = "1.27.2"
golangci-lint = "2.15.0"
hadolint = "2.15.1"
microsandbox = "0.7.8"

[tasks.lint]
description = "Lint Go code and the Dockerfile"
run = ["golangci-lint run --build-tags live ./...", "hadolint Dockerfile"]

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt ./..."

[tasks.quality]
description = "Report local complexity; pass baseline or compare to measure a refactor"
usage = 'arg "[action]" default="report" { choices "report" "baseline" "compare" }'
run = 'python3 scripts/quality.py "${usage_action?}"'

[tasks.cli]
description = "Build the worktree launcher"
run = "go build -o bin/opencode-sandbox ./cmd/opencode-sandbox"

[tasks.install]
description = "Build and install the launcher to ~/.local/bin"
depends = ["cli"]
run = '''
mkdir -p "$HOME/.local/bin"
install -m755 bin/opencode-sandbox "$HOME/.local/bin/opencode-sandbox"
'''

[tasks.build]
description = "Build the sandbox image"
run = "docker build -t opencode-sandbox:poc ."

[tasks.load]
description = "Build and import the image into Microsandbox"
depends = ["build"]
run = "bash -o pipefail -c 'docker save opencode-sandbox:poc | msb load'"

[tasks."test:prepare"]
description = "Build and import the base and custom test images (once, or after image changes)"
depends = ["load"]
run = [
  "docker build --pull=false -t opencode-sandbox:test-custom tests/fixtures/custom-image",
  "bash -o pipefail -c 'docker save opencode-sandbox:test-custom | msb load'",
]

[tasks."test:unit"]
description = "Run fast tests without VMs or external services"
run = "go test -count=1 -timeout 10s ./internal/..."

[tasks."test:image"]
description = "Build and smoke-test the Docker image without VMs or credentials"
depends = ["build"]
run = "go test -count=1 -v -timeout 2m ./tests/image"

[tasks.test]
description = "Run tests using prepared images (no image builds or imports)"
run = "go test -count=1 -v -parallel 4 -timeout 10m ./..."

[tasks."test:live"]
description = "Run the opt-in OpenAI authentication smoke test using host credentials"
run = "go test -count=1 -v -tags live -run '^TestOpenCodeCanReachOpenAI$' -timeout 1m ./tests"
