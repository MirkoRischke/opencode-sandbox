# Location: ~/.config/opencode-sandbox/config.toml
# XDG_CONFIG_HOME overrides ~/.config.
# Unless unrestricted is enabled: DNS hosts/suffixes, HTTPS/WSS on TCP 443 only.
# Network: example.com matches exactly; .example.com includes all subdomains and the base.
# Secrets: example.com matches exactly; *.example.com includes all subdomains and the base.
# Applied only when creating a VM. Recreate it after changing this file.
# Missing configuration uses the built-in host allowlist; invalid configuration fails.

# Optional host file/directory mappings. Nothing is shared implicitly.
# Sources must exist. ~/ means the host home; relative paths use this config's directory.
# Repo file lists replace the global list; top-level files = [] disables inheritance.
# mode defaults to "mount" (read-only); "copy" creates writable guest copies.
# [[files]]
# source = "~/.config/opencode/AGENTS.md"
# target = "/root/.config/opencode/AGENTS.md"
#
# [[files]]
# source = "~/.config/opencode/skills"
# target = "/root/.config/opencode/skills"
#
# [[files]]
# source = "~/.config/opencode-sandbox/opencode.json"
# target = "/etc/opencode/opencode.json"
#
# [[files]]
# source = "~/.config/opencode/cli.json"
# target = "/root/.config/opencode/cli.json"
#
# Copies refresh on creation and snapshot restore, not ordinary resume.
# Directories merge into the exact target, preserving destination-only files.
# [[files]]
# source = "~/.config/opencode-sandbox/gitconfig"
# target = "/root/.gitconfig"
# mode = "copy"

# This example enables GitHub authentication and requires the file below.
# Remove this section to disable loading the credential for new VMs.
# Relative file paths are resolved against this config's directory.
# The credential directory must be mode 700 and file mode 600.
[secrets.github]
file = "creds/github-token"
env = "GH_TOKEN"
allowed_hosts = ["github.com", "api.github.com"]
headers = ["authorization"]

[vm]
# Applied at VM creation only. Sizes are in MiB.
# Image must already be loaded into Microsandbox (msb load); no automatic pulls.
image = "opencode-sandbox:poc"
cpus = 2
memory_mib = 2048
root_disk_mib = 4096
docker_disk_mib = 10240

# Optional: run explicitly with `opencode-sandbox snapshot create`.
# Usually put this section in each repo's .opencode-sandbox.toml instead.
# [snapshot]
# command = "./scripts/sandbox-prepare.sh"

[network]
# Allow any public destination/port/protocol, ignoring both host lists.
# Host/private, loopback, link-local, metadata and multicast remain blocked.
# Secret substitution scopes are unchanged.
unrestricted = false
# Best-effort cumulative denied-target summary per worktree. Also enables all
# Microsandbox runtime debug logs (rotating, about 40 MiB) and HTTP 403 denial
# responses instead of resets where supported. Recreate VM on change.
diagnostics = false
allowed_hosts = [
  # OpenAI subscription inference (legacy Codex and Sign in with ChatGPT)
  # and OAuth token refresh. No credential inspection needed to include both.
  "chatgpt.com",
  "api.openai.com",
  "auth.openai.com",

  # OpenCode model catalog.
  "models.dev",

  # Context7 remote MCP. Documentation retrieval happens server-side;
  # individual documentation sites need not be allowed for this MCP.
  "mcp.context7.com",

  # AWS Knowledge remote MCP. Documentation retrieval happens server-side.
  "knowledge-mcp.global.api.aws",

  # GitHub: HTTPS Git, REST/GraphQL, raw files, source archives, release assets.
  # Credential substitution remains limited to github.com / api.github.com.
  "github.com",
  "api.github.com",
  "raw.githubusercontent.com",
  "codeload.github.com",
  "release-assets.githubusercontent.com",
  "objects.githubusercontent.com",

  # mise's shared version metadata and Go toolchain downloads.
  # Aqua registry metadata/releases use the GitHub hosts above.
  "mise-versions.jdx.dev",
  "dl.google.com",

  # Public Go modules, checksum verification, and redirected module archives.
  "proxy.golang.org",
  "sum.golang.org",
  "storage.googleapis.com",

  # npm packages for OpenCode plugins / language tooling.
  # Remove if unused. Node itself is already installed in the base image.
  "registry.npmjs.org",

  # Public container pulls: Docker Hub auth, registry, and layer downloads.
  "auth.docker.io",
  "registry-1.docker.io",
  "production.cloudflare.docker.com",
  "production.cloudfront.docker.com",
  "docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com",

  # Amazon ECR Public (the gallery website is not needed for docker pull).
  "public.ecr.aws",

  # Optional: installing other Node versions with mise.
  # "nodejs.org",

  # Optional: fetching OpenCode / Microsandbox / Go documentation directly.
  # "opencode.ai",
  # "docs.microsandbox.dev",
  # "go.dev",

  # Optional: existing fake-token echo integration test only.
  # Not needed for normal sandbox use.
  # "httpbingo.org",
]

# Optional directory-local .opencode-sandbox.toml additions to the global baseline above:
# [network]
# additional_allowed_hosts = ["nodejs.org"]
# Both lists use replacement semantics across configs; their union is allowed.
# Set both allowed_hosts and additional_allowed_hosts to [] to deny all internet.

# Scope / limits:
# - Based on this repo's mise.toml and your OpenAI-only sandbox configuration.
# - Other projects, LSP downloads, Git LFS, and Actions logs can need extra hosts.
# - Building/importing the sandbox image on the host is outside this policy.
#   Guest Docker builds still need package/download hosts explicitly allowed;
#   ghcr.io and Debian mirrors are not included here.
# - Shared hosts (especially storage.googleapis.com, GitHub, npm) serve content
#   from many users. An allowlist is not an exfiltration or read-only guarantee.
# - No unrestricted web browsing/search; add destinations deliberately.
#
# Sources:
# https://github.com/anomalyco/opencode/blob/v2.0.30/packages/core/src/plugin/provider/openai.ts
# https://github.com/anomalyco/opencode/blob/v2.0.30/packages/core/src/plugin/provider/chatgpt.ts
# https://github.com/upstash/context7#installation
# https://awslabs.github.io/mcp/servers/aws-knowledge-mcp-server
# https://github.com/jdx/mise/blob/v2026.10.12/settings.toml
# https://github.com/jdx/mise/blob/v2026.10.12/src/aqua/aqua_registry_wrapper.rs
# https://go.dev/ref/mod#module-proxy
# https://docs.docker.com/desktop/setup/allow-list/
# https://docs.aws.amazon.com/AmazonECR/latest/public/docker-pull-ecr-image.html
